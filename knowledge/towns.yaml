  - VAIL
  - ESTES PARK
  - WEST YELLOWSTONE
  - LAKE PLACID
  - MONTAUK

# 治安调研库（口径：公开来源交叉——FBI UCR / City-Data / CrimeGrade / 当地警局报告；
# 注意：小旅游镇人均犯罪率会被游客拉高，口径冲突必须注明）
